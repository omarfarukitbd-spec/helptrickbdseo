name: "360 BD Exam Radar & Telegram Cloud Alert"

on:
  schedule:
    # Runs 3 times a day at 9:00 AM, 2:00 PM, 7:00 PM Bangladesh Standard Time (UTC+6)
    - cron: '0 3,8,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-exam-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telegram Exam Radar Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tools/trend_forecaster/telegram_radar_notifier.py

      - name: Commit Seen Notices Cache
        run: |
          git config --global user.name "HelpTrickBD Cloud Bot"
          git config --global user.email "bot@helptrickbd.com"
          git add tools/trend_forecaster/seen_radar_notices.json bd_exam_seo_radar_report.md || true
          git diff --staged --quiet || (git commit -m "chore(radar): update seen exam notices cache [skip ci]" && git push)
