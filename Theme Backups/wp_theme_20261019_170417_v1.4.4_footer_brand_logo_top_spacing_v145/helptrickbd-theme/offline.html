<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপনি বর্তমানে অফলাইনে আছেন — HelpTrickBD</title>
    <style>
        :root {
            --ht-primary: #2563eb;
            --ht-bg: #f8fafc;
            --ht-surface: #ffffff;
            --ht-text-main: #0f172a;
            --ht-text-muted: #475569;
            --ht-border: #e2e8f0;
            --ht-radius: 12px;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--ht-bg);
            color: var(--ht-text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .ht-offline-card {
            background: var(--ht-surface);
            border: 1px solid var(--ht-border);
            border-radius: var(--ht-radius);
            padding: 40px 32px;
            max-width: 480px;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08);
            margin: 20px;
        }
        .ht-offline-icon {
            width: 64px;
            height: 64px;
            fill: #ef4444;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--ht-text-muted);
            margin-bottom: 24px;
        }
        .ht-btn {
            display: inline-block;
            background: var(--ht-primary);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .ht-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="ht-offline-card">
        <svg class="ht-offline-icon" viewBox="0 0 24 24">
            <path d="M23.64 7c-.45-.34-4.93-3.66-11.64-3.66S.81 6.66.36 7l10.08 12.56c.8 1 2.32 1 3.12 0L23.64 7z" opacity="0.3"/>
            <path d="M3.51 3.51A21.39 21.39 0 0 0 .36 7l10.08 12.56c.8 1 2.32 1 3.12 0l4.31-5.36L20.49 20.5l1.41-1.41L4.93 2.1 3.51 3.51z"/>
        </svg>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>আপনি বর্তমানে অফলাইনে আছেন। আপনার পূর্বে ব্রাউজ করা সংরক্ষিত হ্যান্ডনোট ও পেজগুলো দেখার জন্য ক্যাশ মেমরি পরীক্ষা করুন অথবা ইন্টারনেট চালু করে পুনরায় চেষ্টা করুন।</p>
        <button class="ht-btn" onclick="window.location.reload();">পুনরায় চেষ্টা করুন</button>
    </div>
</body>
</html>
